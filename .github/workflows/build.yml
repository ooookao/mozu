name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Package app
        run: |
          scripts/package-macos.sh target/debug/mozu target/Mozu.app
          plutil -lint target/Mozu.app/Contents/Info.plist
