[package]
name = "mozu"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ooookao/mozu"
publish = false

[workspace]
exclude = ["crates/ui"]

[dependencies]
mozu-audio = "=0.3.0"
mozu-ui = { path = "crates/ui" }
gpui = { package = "kinu-gpui", version = "=0.2.1" }
gpui_platform = { package = "kinu-gpui-platform", version = "=0.2.1", features = ["font-kit"] }
kinu_ui = "=0.2.1"
async-channel = "2.5"
base64 = "0.22"
jsonwebtoken = "9.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
security-framework = "3.7"
sha2 = "0.10"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
block2 = "0.6"
core-foundation = "0.10"
coreaudio-sys = "0.2.18"
libc = "0.2"
rtrb = "0.3.6"
core-graphics = { version = "0.24", features = ["elcapitan"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSApplication", "NSEvent", "NSGraphics", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSToolbar", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2", "objc2-quartz-core"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["AVAudioApplication", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSProcessInfo", "NSString", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
raw-window-handle = "0.6"
realfft = "3.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sparkle-updater = "=0.1.0"

[dev-dependencies]
tempfile = "3.27"

[[test]]
name = "updater_native"
path = "tests/updater_native.rs"
harness = false

[profile.dev]
debug = 0
