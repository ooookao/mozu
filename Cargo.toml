[package]
name = "mozu"
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ooookao/mozu"
publish = false

[workspace]
exclude = ["crates/ui"]

[dependencies]
mozu-audio = "=0.3.0"
g2v-ui = { path = "crates/ui" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "14359a0cdd00657eb68fa946bfd99cd83c26e002" }
async-channel = "2.5"
block2 = "0.6"
core-foundation = "0.10"
coreaudio-sys = "0.2.18"
libc = "0.2"
rtrb = "0.3.6"
core-graphics = { version = "0.24", features = ["elcapitan"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSApplication", "NSEvent", "NSGraphics", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSToolbar", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2", "objc2-quartz-core"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["AVAudioApplication", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSProcessInfo", "NSString", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
raw-window-handle = "0.6"
realfft = "3.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.4"

[dev-dependencies]
tempfile = "3.27"

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/g2vai/zed", rev = "4e3a6e853efbf398b5f33b941fc16c5b71f1853c", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/g2vai/zed", rev = "4e3a6e853efbf398b5f33b941fc16c5b71f1853c", version = "=0.1.0" }
gpui_platform = { git = "https://github.com/g2vai/zed", rev = "4e3a6e853efbf398b5f33b941fc16c5b71f1853c" }
gpui_util = { git = "https://github.com/g2vai/zed", rev = "4e3a6e853efbf398b5f33b941fc16c5b71f1853c" }

[profile.dev]
debug = 0
